server:
  port: 8081

spring:
  datasource:
    # Using Supabase Session Pooler in ap-southeast-2 (Sydney)
    url: jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0
    username: postgres.qzbdttfkakoqyxyawotj
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false # Prevents crashing if metadata check fails
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-edubridge.us.auth0.com/
          audiences: dev-edubridge
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: edubridge-vault-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

aws:
  # Use environment variables
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  s3:
    bucket-name: edubridge-vault
    region: ap-south-1
