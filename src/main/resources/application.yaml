server:
  port: ${PORT:8081}

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    # Using Supabase Session Pooler in ap-southeast-2 (Sydney)
    url: jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0
    username: postgres.qzbdttfkakoqyxyawotj
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false # Prevents crashing if metadata check fails

  flyway:
    enabled: true
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-edubridge.us.auth0.com/
          audiences: dev-edubridge
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        acknowledge-mode: manual

edubridge:
  vault:
    security:
      jwks-connect-timeout-ms: 10000
      jwks-read-timeout-ms: 10000
      issuer-uri: https://dev-edubridge.us.auth0.com/
    cors:
      allowed-origins: "http://localhost:5173,http://localhost:5174"

aws:
  s3:
    bucket-name: edubridge-vault
    region: ap-south-1
  secrets-manager:
    secret-name: "edubridge/vault/production/secrets"
